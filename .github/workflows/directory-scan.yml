name: Directory Scan
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python impilo_directory_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-scan-results
          path: impilo_directory_targets.csv
          if-no-files-found: warn
