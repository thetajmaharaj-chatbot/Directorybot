name: Directory Scan
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Impilo Directory Bot
        run: python impilo_directory_bot.py
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-scan-results
          path: impilo_directory_targets.csv
          if-no-files-found: warn
